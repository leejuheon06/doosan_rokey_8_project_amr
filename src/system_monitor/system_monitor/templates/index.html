<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏥 스마트 병동 중앙 관제 시스템</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/socket.io-client@4.7.2/dist/socket.io.min.js"></script>
    <style>
        body { background-color: #f8f9fa; }
        .card-robot { border-radius: 12px; transition: all 0.3s ease; }
        .card-robot:hover { transform: translateY(-5px); box-shadow: 0 8px 15px rgba(0,0,0,0.1); }
        .status-badge { font-size: 0.9rem; padding: 6px 12px; border-radius: 20px; }
        
        /* 🗺️ 실시간 ROS 2 지도 캔버스 스타일 (세로 길어짐 방지 및 1:1 고정) */
        .map-container {
            position: relative;
            width: 100%;
            max-width: 500px; 
            aspect-ratio: 125 / 157;   /* 📐 실제 map.pgm/png 픽셀 비율 (125 x 157) 과 일치 */
            margin: 0 auto;
            background-color: #e9ecef; 
            background-image: url('/static/map.png'); 
            background-size: contain;   
            background-repeat: no-repeat;
            background-position: center;
            border: 2px solid #dee2e6;
            border-radius: 12px;
            overflow: hidden;
        }
    
        .map-grid-lines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: linear-gradient(to right, rgba(0,0,0,0.08) 1px, transparent 1px),
                            linear-gradient(to bottom, rgba(0,0,0,0.08) 1px, transparent 1px);
            background-size: 10px 10px; 
            z-index: 1; 
            pointer-events: none; 
        }

        .robot-marker {
            position: absolute;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: left 0.3s ease-out, top 0.3s ease-out;
            box-shadow: 0 0 10px rgba(0,0,0,0.3);
            z-index: 10;
        }
        .marker-amr1 { background-color: #0d6efd; border: 2px solid #fff; } 
        .marker-amr2 { background-color: #0dcaf0; border: 2px solid #fff; } 
        
        .marker-label {
            position: absolute;
            top: -22px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0, 0, 0, 0.7);
            color: #fff;
            font-size: 0.75rem;
            padding: 2px 6px;
            border-radius: 4px;
            white-space: nowrap;
        }

        @keyframes pulse-red {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(220, 53, 69, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(220, 53, 69, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(220, 53, 69, 0); }
        }
        .pulse-active {
            animation: pulse-red 1.5s infinite;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark bg-dark mb-4 shadow-sm">
        <div class="container">
            <span class="navbar-brand mb-0 h1">🏥 Smart Ward Central Monitoring System</span>
            <a href="/history-page" class="btn btn-outline-light btn-sm">📜 누적 투약 이력 조회</a>
        </div>
    </nav>

    <div class="container">
        <div class="row g-4">
            
            <div class="col-lg-5">
                <div class="card shadow-sm mb-4">
                    <div class="card-header bg-primary text-white font-weight-bold">
                        🧬 신규 수액 투약 등록
                    </div>
                    <div class="card-body">
                        <form id="infusion-form">
                            <div class="row g-3">
                                <div class="col-6">
                                    <label class="form-label"> 환자 ID</label>
                                    <input type="text" class="form-control" id="patient_id" value="P001" required>
                                </div>
                                <div class="col-6">
                                    <label class="form-label">환자 이름</label>
                                    <input type="text" class="form-control" id="patient_name" value="홍길동" required>
                                </div>
                                <div class="col-6">
                                    <label class="form-label">간호사 ID</label>
                                    <input type="text" class="form-control" id="nurse_id" value="N123" required>
                                </div>
                                <div class="col-6">
                                    <label class="form-label">간호사 이름</label>
                                    <input type="text" class="form-control" id="nurse_name" value="김간호" required>
                                </div>
                                <div class="col-12">
                                    <label class="form-label">수액 명칭</label>
                                    <select class="form-select" id="fluid_name">
                                        <option value="일반 식염수 (0.9% NaCl)">일반 식염수 (0.9% NaCl)</option>
                                        <option value="포도당 수액 (5% Dextrose)">포도당 수액 (5% Dextrose)</option>
                                        <option value="하트만 용액 (Hartmann)">하트만 용액 (Hartmann)</option>
                                    </select>
                                </div>
                                <div class="col-12">
                                    <label class="form-label">투약 용량 (ml)</label>
                                    <div class="input-group">
                                        <input type="number" class="form-control" id="fluid_volume" value="5" min="1" required>
                                        <span class="input-group-text">ml </span>
                                    </div>
                                </div>
                                <div class="col-12">
                                    <button type="submit" class="btn btn-success w-100 py-2 shadow-sm"> 링거 투약 시작</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>

                <div class="card shadow-sm">
                    <div class="card-header bg-dark text-white font-weight-bold d-flex justify-content-between align-items-center">
                        <span>🗺️ 실시간 병동 지도 관제 (AMCL)</span>
                        <div class="small">
                            <span class="badge bg-primary me-1">● AMR1</span>
                            <span class="badge bg-info text-dark">● AMR2</span>
                        </div>
                    </div>
                    <div class="card-body bg-light p-2">
                        <div class="map-container" id="map-area">
                            <div class="map-grid-lines"></div>
                            <div id="marker-amr1" class="robot-marker marker-amr1" style="left: 50%; top: 50%;">
                                <div class="marker-label">AMR 1</div>
                            </div>
                            <div id="marker-amr2" class="robot-marker marker-amr2" style="left: 50%; top: 50%;">
                                <div class="marker-label">AMR 2</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-lg-7">
                <div class="row g-4">
                    
                    <div class="col-12">
                        <div id="nurse-call-panel" class="card shadow-sm border-start border-success border-5">
                            <div class="card-body d-flex justify-content-between align-items-center">
                                <div>
                                    <div class="d-flex align-items-center mb-1">
                                        <span id="nurse-call-indicator" class="badge bg-success rounded-circle me-2" style="width: 12px; height: 12px; padding: 0;">&nbsp;</span>
                                        <h4 class="card-title mb-0 fw-bold" id="nurse-call-title">🚨 간호사 호출 시스템 (Nurse Call)</h4>
                                    </div>
                                    <p class="card-text text-muted mb-0 id-status-text" id="nurse-call-status-desc">현재 모든 병동 내부 신호가 정상 상태입니다.</p>
                                    <small id="nurse-call-time-text" class="text-danger fw-bold" style="display: none;"></small>
                                </div>
                                <div>
                                    <button id="btn-clear-call" class="btn btn-secondary px-3 py-2 fw-bold shadow-sm" onclick="clearNurseCall()" disabled>
                                         호출 확인
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col-12">
                        <div class="card card-robot shadow-sm border-start border-primary border-5">
                            <div class="card-body">
                                <div class="d-flex justify-content-between align-items-center mb-3">
                                    <h4 class="card-title mb-0 text-primary">🤖 AMR 1 [수액 관리 로봇]</h4>
                                    <span id="amr1-timer-running" class="badge bg-secondary status-badge">대기 중</span>
                                </div>
                                <div class="row text-center bg-light p-3 rounded g-2">
                                    <div class="col-6">
                                        <div class="text-muted small">배터리 잔량</div>
                                        <h5 id="amr1-battery" class="mb-0 fw-bold">- %</h5>
                                    </div>
                                    <div class="col-6">
                                        <div class="text-muted small">실시간 타이머 잔여시간</div>
                                        <h5 id="amr1-timer" class="mb-0 text-danger fw-bold">0분 0초 남음</h5>
                                    </div>
                                   
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="col-12">
                        <div class="card card-robot shadow-sm border-start border-info border-5">
                            <div class="card-body">
                                <h4 class="card-title text-info mb-3">🤖 AMR 2 [링거 배송 로봇]</h4>
                                <div class="row text-center bg-light p-3 rounded mb-3 g-2">
                                    <div class="col-12">
                                        <div class="text-muted small">배터리 잔량</div>
                                        <h5 id="amr2-battery" class="mb-0 fw-bold">- %</h5>
                                    </div>
                                </div>
                                
                                <div class="mb-3">
                                    <label class="form-label small text-muted fw-bold">[1단계] 도킹 스테이션 출발 신호</label>
                                    <button class="btn btn-primary w-100 py-2 shadow-sm" onclick="sendAmr2Command(true, 0)">
                                         AMR2 UNDOCK
                                    </button>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label small text-muted fw-bold">[2단계] 목적지 병실 출동 (언독 완료 후 가능)</label>
                                    <div class="d-flex gap-2">
                                        <button class="btn btn-info text-white flex-fill py-2" onclick="sendAmr2Command(true, 101)">101호 출동</button>
                                        <button class="btn btn-info text-white flex-fill py-2" onclick="sendAmr2Command(true, 102)">102호 출동</button>
                                        <button class="btn btn-info text-white flex-fill py-2" onclick="sendAmr2Command(true, 103)">103호 출동</button>
                                    </div>
                                </div>

                                <div>
                                    <label class="form-label small text-muted fw-bold">[3단계] 업무 종료 및 스테이션 복귀</label>
                                    <button class="btn btn-secondary w-100 py-2" onclick="sendAmr2Command(false, 0)">
                                        AMR2 RETURN
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                </div>
            </div>

        </div>
    </div>

    <script>
        const socket = io();

        // 🗺️ [지도 메타데이터] = 웹페이지에 깔리는 배경 지도(amr2 기준 map.png/map.yaml)
        //   - origin/resolution 은 amr2 map.yaml 의 값
        //   - imageWidth/Height 는 표시 지도(map.png) 의 실제 픽셀 크기 (125 x 157)
        const MAP_CONFIG = {
            originX: -5.76,       // (amr2) map.yaml origin[0]
            originY: -1.79,       // (amr2) map.yaml origin[1]
            resolution: 0.05,     // map.yaml resolution (m/px)
            imageWidth: 125,      // 표시 지도 실제 가로 픽셀
            imageHeight: 157      // 표시 지도 실제 세로 픽셀
        };

        // 🧭 [로봇별 좌표 프레임 정렬(Frame Alignment)]
        //   amr2 는 화면에 깔린 지도(map.png)와 같은 맵을 쓰므로 변환 없음(항등).
        //   amr1 은 "다른 pgm/yaml(origin -5.39,-1.62, 123x172)"을 쓰기 때문에
        //   amcl_pose 가 amr2 지도 프레임과 호환되지 않는다.
        //   => 두 점유격자(occupancy grid)를 정합(registration)해서 얻은 강체변환
        //      (회전 5.25°, 평행이동)을 적용해 amr1 좌표를 표시 지도 프레임으로 옮긴다.
        //      world2 = R * world1 + t   (R=[[cos,-sin],[sin,cos]])
        const FRAME_ALIGN = {
            amr1: { cos: 0.995805, sin: 0.091502, tx: 0.155779, ty: -0.326210 },
            amr2: { cos: 1.0,      sin: 0.0,      tx: 0.0,      ty: 0.0       }
        };

        // 📐 [표준 ROS map_server 좌표 변환]
        //   (로봇 프레임 정렬) -> world(m) -> 이미지 픽셀 -> 컨테이너 퍼센트(%)
        //   * map_server 규약: origin 은 지도 이미지의 "좌측 하단" 픽셀의 실제 좌표.
        //   * 이미지 파일은 좌측 "상단"이 (0,0)이므로 Y축을 뒤집어 줘야 한다.
        function updateRobotMapPosition(robotId, amclX, amclY) {
            const marker = document.getElementById(`marker-${robotId}`);
            if (marker == null || amclX == null || amclY == null) return;

            // 0. 로봇별 프레임 정렬: 각 로봇의 amcl_pose 를 "표시 지도" 프레임으로 변환
            const T = FRAME_ALIGN[robotId] || FRAME_ALIGN.amr2;
            const worldX = T.cos * amclX - T.sin * amclY + T.tx;
            const worldY = T.sin * amclX + T.cos * amclY + T.ty;

            // 1. 월드 좌표(m) -> 이미지 픽셀 좌표
            const pixelX = (worldX - MAP_CONFIG.originX) / MAP_CONFIG.resolution;
            // Y 뒤집기: 이미지 상단(0) = 월드 최대 Y
            const pixelY = MAP_CONFIG.imageHeight - (worldY - MAP_CONFIG.originY) / MAP_CONFIG.resolution;

            // 2. 픽셀 -> 컨테이너 퍼센트(%) (컨테이너 비율 = 이미지 비율 이므로 1:1 대응)
            let percentX = (pixelX / MAP_CONFIG.imageWidth) * 100;
            let percentY = (pixelY / MAP_CONFIG.imageHeight) * 100;

            // 3. 지도 밖 탈출 방지 경계 처리
            percentX = Math.max(0, Math.min(100, percentX));
            percentY = Math.max(0, Math.min(100, percentY));

            // 4. 화면 스타일 반영
            marker.style.left = `${percentX}%`;
            marker.style.top = `${percentY}%`;

            console.log(`🤖 [AMCL 매핑] ${robotId} -> in(${amclX.toFixed(2)}, ${amclY.toFixed(2)}) | disp(${worldX.toFixed(2)}, ${worldY.toFixed(2)}) | UI(${percentX.toFixed(1)}%, ${percentY.toFixed(1)}%)`);
        }

        socket.on('robot_update', (data) => {
            const rId = data.robot;
            
            if (data.type === 'battery') {
                document.getElementById(`${rId}-battery`).innerText = `${data.value}%`;
            } 
            else if (data.type === 'pose') {
                updateRobotMapPosition(rId, data.x, data.y);
            } 
            else if (data.type === 'timer') {
                if (rId === 'amr1') {
                    document.getElementById('amr1-timer').innerText = data.value;
                    const badge = document.getElementById('amr1-timer-running');
                    if (data.value.includes("0초 남음") || data.value === "") {
                        badge.innerText = "대기 중";
                        badge.className = "badge bg-secondary status-badge";
                    } else {
                        badge.innerText = "투약 중";
                        badge.className = "badge bg-danger status-badge";
                    }
                }
            }
        });

        socket.on('nurse_call', (data) => {
            const panel = document.getElementById('nurse-call-panel');
            const indicator = document.getElementById('nurse-call-indicator');
            const desc = document.getElementById('nurse-call-status-desc');
            const timeText = document.getElementById('nurse-call-time-text');
            const clearBtn = document.getElementById('btn-clear-call');

            if (data.is_called) {
                panel.className = "card shadow-sm border-start border-danger border-5 bg-gradient";
                panel.style.backgroundColor = "#fff5f5";
                indicator.className = "badge bg-danger rounded-circle me-2 pulse-active";
                desc.innerHTML = `⚠️ <strong>[비상 상황]</strong> 디바이스 <strong>${data.monitor_id}</strong>에서 호출이 발생했습니다!`;
                timeText.innerText = `발생 시각: ${data.called_at}`;
                timeText.style.display = 'block';
                clearBtn.className = "btn btn-danger px-3 py-2 fw-bold shadow";
                clearBtn.disabled = false;
            } else {
                panel.className = "card shadow-sm border-start border-success border-5";
                panel.style.backgroundColor = "";
                indicator.className = "badge bg-success rounded-circle me-2";
                desc.innerText = "현재 모든 병동 내부 신호가 정상 상태입니다.";
                timeText.style.display = 'none';
                clearBtn.className = "btn btn-secondary px-3 py-2 fw-bold shadow-sm";
                clearBtn.disabled = true;
            }
        });

        function clearNurseCall() {
            fetch('/api/calls/nurse-check', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ monitor_id: 'monitor1' })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) console.log('Nurse Call 상태 해제 요청이 접수되었습니다.');
            })
            .catch(err => console.error('에러:', err));
        }

        document.getElementById('infusion-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const payload = {
                patient_id: document.getElementById('patient_id').value,
                patient_name: document.getElementById('patient_name').value, 
                nurse_id: document.getElementById('nurse_id').value,
                nurse_name: document.getElementById('nurse_name').value,     
                fluid_name: document.getElementById('fluid_name').value,
                fluid_volume: document.getElementById('fluid_volume').value
            };

            fetch('/api/infusion', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(resData => {
                if (resData.success) {
                    alert(`✅ 타이머 구동 완료!\n예상 완료 시각: ${resData.data.end_time}`);
                } else {
                    alert(`❌ 등록 실패: ${resData.message}`);
                }
            })
            .catch(err => console.error('에러:', err));
        });

        function sendAmr2Command(goValue, roomIdValue) {
            const commandValue = goValue ? 'GO' : 'RETURN';
            
            fetch('/api/amr2/command', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    command: commandValue, 
                    room_id: roomIdValue 
                })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    alert(`🤖 AMR2 명령 전달 성공`);
                } else {
                    alert(`❌ 명령 실패: ${data.message}`);
                }
            })
            .catch(err => console.error('에러:', err));
        }
    </script>
</body>
</html>
